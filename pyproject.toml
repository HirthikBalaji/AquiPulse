[project]
name = "aquipulse"
version = "0.1.0"
description = "Fleet-Scale Groundwater Intelligence from the Electrical Heartbeat of Irrigation Pumps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jax>=0.11.2",
    "mypy>=2.4.0",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "paho-mqtt>=2.1.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.16.10",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sim*", "phi*", "opt*", "fat*", "mep*", "ise*", "api*", "ingest*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
